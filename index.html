<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>💖 TriviLocura 💖</title>
<style>
    /* Reset */
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}

    /* Animated rainbow background */
    :root{
        --card-bg: rgba(255,255,255,0.95);
    }
    body{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
        background: linear-gradient(120deg,#ff9a9e 0%, #fecfef 10%, #f6d365 20%, #fda085 30%, #a1c4fd 45%, #c2e9fb 55%, #d4fc79 70%, #96e6a1 85%, #fbc2eb 100%);
        background-size: 400% 400%;
        animation: rainbow 18s linear infinite;
    }
    @keyframes rainbow{
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }

    /* Container */
    .container{
        width:100%;
        max-width:980px;
        background: var(--card-bg);
        border-radius:16px;
        box-shadow:0 15px 40px rgba(0,0,0,0.18);
        overflow:hidden;
        position:relative;
    }

    /* Header */
    .header{
        padding:18px 22px;
        text-align:center;
        background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
        border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .title{
        font-size:1.9rem;
        font-weight:800;
        letter-spacing:0.6px;
        display:flex;
        justify-content:center;
        align-items:center;
        gap:10px;
    }
    .title .heart{
        color:#ff5c9e;
        font-size:1.3rem;
        transform:translateY(-2px);
    }
    .subtitle{ color:#666; margin-top:6px; font-size:0.95rem; opacity:0.95 }

    /* Timer / progress */
    .timer-container{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:12px 20px;
        background:linear-gradient(to right, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
        border-bottom:1px solid rgba(0,0,0,0.04);
    }
    .timer{ font-weight:700; color:#d6336c; background:#fff; padding:6px 12px;border-radius:20px; box-shadow:0 2px 6px rgba(0,0,0,0.06)}
    .progress{ font-weight:600; color:#333 }

    /* Selection screen */
    .category-selection{ padding:26px; text-align:center }
    .category-title{ font-size:1.4rem; font-weight:700; margin-bottom:16px; color:#222 }
    .categories-container{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin:14px 0 22px }
    .category-card{
        background:linear-gradient(180deg,rgba(255,255,255,0.7),rgba(255,255,255,0.5));
        padding:14px;border-radius:12px;border:2px solid rgba(0,0,0,0.04);
        cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;
        display:flex;flex-direction:column;align-items:center;gap:8px;
        min-height:84px;justify-content:center;
    }
    .category-card:hover{ transform:translateY(-6px); box-shadow:0 10px 25px rgba(0,0,0,0.08) }
    .category-card.selected{ outline:3px solid rgba(0,0,0,0.06); transform:translateY(-2px); }
    .category-icon{ font-size:1.6rem }
    .category-name{ font-weight:700 }

    /* Quiz screen */
    .quiz-container{ padding:22px 26px 30px }
    .question-container{ margin-bottom:18px }
    .question-number{ color:#6c757d; margin-bottom:6px }
    .question-text{ font-size:1.25rem; font-weight:700; color:#222; line-height:1.4; margin-bottom:10px }
    .category-tag{ display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; color:#fff; margin-bottom:10px }

    .options-container{ display:flex; flex-direction:column; gap:12px; margin-top:10px }
    .option{
        display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:2px solid rgba(0,0,0,0.06);
        background:linear-gradient(180deg, #fff, #f8f9fb); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    }
    .option:hover{ transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.06) }
    .option.selected{ background: linear-gradient(90deg,#6a11cb,#2575fc); color:#fff; border-color:transparent }
    .option-letter{ width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;background:#eef2ff }
    .option.selected .option-letter{ background: rgba(255,255,255,0.25) }

    /* Navigation buttons */
    .navigation{ display:flex; justify-content:space-between; gap:8px; margin-top:18px }
    .btn{ padding:12px 20px;border-radius:10px;border:none;font-weight:800; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.06) }
    .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none }
    .btn-prev{ background:#adb5bd; color:#fff }
    .btn-next{ background: linear-gradient(90deg,#4a00e0,#8e2de2); color:#fff }
    .btn-start{ background: linear-gradient(90deg,#ff7eb3,#ff758c); color:#fff; padding:14px 28px; font-size:1.05rem }

    /* Result screen */
    .results-container{ padding:22px }
    .results-title{ font-size:1.6rem; color:#6a11cb; font-weight:800; text-align:center }
    .score{ font-size:2.4rem; font-weight:900; color:#4a00e0; text-align:center; margin:10px 0 6px }
    .results-summary{ margin-top:18px; background:#fff; padding:16px; border-radius:10px; max-height:360px; overflow:auto; border:1px solid rgba(0,0,0,0.04) }
    .result-item{ padding:12px;border-bottom:1px dashed rgba(0,0,0,0.04) }
    .result-question{ font-weight:800; margin-bottom:6px }
    .correct{ color:#28a745; font-weight:800 }
    .incorrect{ color:#dc3545; font-weight:800 }

    /* Feedback overlay */
    .feedback{
        position: absolute;
        left:50%;
        transform:translateX(-50%);
        top:26%;
        z-index:60;
        min-width:260px;
        max-width:80%;
        text-align:center;
        padding:14px 18px;
        border-radius:12px;
        display:none;
        align-items:center;
        gap:10px;
        box-shadow:0 14px 40px rgba(0,0,0,0.18);
        font-weight:900;
        font-size:1.05rem;
    }
    .feedback.show{ display:flex; animation:pop .32s ease both }
    @keyframes pop{ from{ transform:translateX(-50%) scale(0.8); opacity:0 } to{ transform:translateX(-50%) scale(1); opacity:1 } }

    .feedback.correct{ background: linear-gradient(90deg,#e9ffea,#d6ffe0); color:#1f7a3a }
    .feedback.incorrect{ background: linear-gradient(90deg,#ffe7e7,#ffdcdc); color:#8a1f2b }

    /* Confetti canvas covers whole container */
    #confetti-canvas{ position:absolute; inset:0; pointer-events:none; z-index:50 }

    /* Shake animation for incorrect */
    .shake{ animation:shake .45s ease both }
    @keyframes shake{
        10%,90%{ transform:translateX(-1px) }
        20%,80%{ transform:translateX(2px) }
        30%,50%,70%{ transform:translateX(-4px) }
        40%,60%{ transform:translateX(4px) }
    }

    /* Mobile tweaks */
    @media(max-width:640px){
        .title{ font-size:1.4rem }
        .question-text{ font-size:1.05rem }
        .btn{ padding:10px 14px }
    }
</style>
</head>
<body>
<div class="container" id="app">
    <canvas id="confetti-canvas"></canvas>

    <div class="header">
        <div class="title">
            <span class="heart">💗</span>
            <span>TriviLocura</span>
            <span class="heart">💗</span>
        </div>
        <div class="subtitle">Elige una categoría y demuestra lo que sabes — ¡diviértete! 🎉</div>
    </div>

    <!-- Timer / progress -->
    <div class="timer-container">
        <div class="progress">Pregunta <span id="current-question">1</span> de 10</div>
        <div class="timer">Tiempo: <span id="time">02:00</span></div>
    </div>

    <!-- Category selection -->
    <div id="category-screen" class="category-selection">
        <h2 class="category-title">💖 Elige una categoría para estudiar</h2>
        <div class="categories-container" id="categories-container"></div>
        <button id="start-btn" class="btn btn-start" disabled>Comenzar Cuestionario</button>
    </div>

    <!-- Quiz screen -->
    <div id="quiz-screen" class="quiz-container hidden" style="display:none">
        <div class="question-container">
            <div class="question-number">Pregunta <span id="question-number">1</span></div>
            <div class="category-tag" id="question-category"></div>
            <div class="question-text" id="question-text"></div>
        </div>

        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

        <div class="options-container" id="options-container"></div>

        <div class="navigation">
            <button id="prev-btn" class="btn btn-prev" disabled>Anterior</button>
            <button id="next-btn" class="btn btn-next">Siguiente</button>
        </div>
    </div>

    <!-- Results screen -->
    <div id="results-screen" class="results-container hidden" style="display:none">
        <h2 class="results-title">Resultados del Cuestionario</h2>
        <div class="score" id="final-score">0/10</div>
        <p id="result-message" style="text-align:center"></p>
        <div class="results-summary" id="results-summary"></div>
        <div style="text-align:center; margin-top:14px;">
            <button id="restart-btn" class="btn btn-start">Volver a Seleccionar Categorías</button>
        </div>
    </div>
</div>

<script>
/* -------------------------
   Datos de categorías y preguntas (sin imágenes)
   ------------------------- */
const categories = [
    { id: 'matematicas', name: 'Matemáticas', color: '#FF6B6B', icon: '∑' },
    { id: 'ciencias', name: 'Ciencias', color: '#4ECDC4', icon: '🔬' },
    { id: 'historia', name: 'Historia', color: '#FFD166', icon: '📜' },
    { id: 'geografia', name: 'Geografía', color: '#06D6A0', icon: '🌎' },
    { id: 'literatura', name: 'Literatura', color: '#118AB2', icon: '📚' },
    { id: 'arte', name: 'Arte', color: '#073B4C', icon: '🎨' },
    { id: 'deportes', name: 'Deportes', color: '#EF476F', icon: '⚽' },
    { id: 'tecnologia', name: 'Tecnología', color: '#7209B7', icon: '💻' },
    { id: 'mixtas', name: 'Preguntas Mixtas', color: '#FF9E64', icon: '🎲' }
];

function generateQuestions(){
    return [
        // MATEMÁTICAS (10)
        
    { id:1, question:"¿Cuál es el resultado de 15 + 27?", options:["40","42","38","45"], correct:1, explanation:"15 + 27 = 42", category:"matematicas" },
    { id:2, question:"¿Cuánto es 8 × 9?", options:["70","64","72","81"], correct:2, explanation:"8 × 9 = 72", category:"matematicas" },
    { id:3, question:"¿Cuál es la raíz cuadrada de 81?", options:["7","8","9","10"], correct:2, explanation:"9 × 9 = 81", category:"matematicas" },
    { id:4, question:"¿Cuántos lados tiene un pentágono?", options:["5","6","7","8"], correct:0, explanation:"Un pentágono es un polígono de 5 lados.", category:"matematicas" },
    { id:5, question:"¿Cuál es el área de un cuadrado de 6 cm de lado?", options:["12 cm²","24 cm²","30 cm²","36 cm²"], correct:3, explanation:"Área = lado × lado = 6 × 6 = 36 cm²", category:"matematicas" },
    { id:6, question:"¿Qué porcentaje es 10 de 50?", options:["10%","20%","25%","50%"], correct:1, explanation:"(10 / 50) × 100 = 0.2 × 100 = 20%", category:"matematicas" },
    { id:7, question:"¿Cuál es el resultado de 50 - 18?", options:["32","38","22","42"], correct:0, explanation:"50 - 18 = 32", category:"matematicas" },
    { id:8, question:"¿Qué fracción es equivalente a 0.25?", options:["1/2","1/3","1/4","1/5"], correct:2, explanation:"0.25 representa un cuarto de la unidad.", category:"matematicas" },
    { id:9, question:"¿Cuál es el perímetro de un rectángulo de 5cm de largo y 3cm de ancho?", options:["15 cm","16 cm","8 cm","30 cm"], correct:1, explanation:"Perímetro = 2 * (largo + ancho) = 2 * (5 + 3) = 16 cm", category:"matematicas" },
    { id:10, question:"¿Cuánto es 10 + 4 × 3?", options:["42","22","34","30"], correct:1, explanation:"Por orden de operaciones, primero la multiplicación: 4 × 3 = 12. Luego 10 + 12 = 22.", category:"matematicas" },
    { id:11, question:"¿Cuántos grados suman los ángulos interiores de un triángulo?", options:["90°","180°","270°","360°"], correct:1, explanation:"La suma de los ángulos interiores de cualquier triángulo es 180°.", category:"matematicas" },
    { id:12, question:"¿Cuál es el valor de π (pi) redondeado a dos decimales?", options:["3.12","3.16","3.18","3.14"], correct:3, explanation:"π ≈ 3.14159... se redondea a 3.14", category:"matematicas" },
    { id:13, question:"¿Cuánto es 7²?", options:["14","49","42","35"], correct:1, explanation:"7² (siete al cuadrado) = 7 × 7 = 49", category:"matematicas" },
    { id:14, question:"¿Cuál es el resultado de 1/3 + 1/3?", options:["2/6","1/9","2/3","1/3"], correct:2, explanation:"Al sumar fracciones con el mismo denominador, solo se suman los numeradores: 1 + 1 = 2.", category:"matematicas" },
    { id:15, question:"¿Qué número romano es 'L'?", options:["10","50","100","500"], correct:1, explanation:"L = 50, C = 100, D = 500, M = 1000.", category:"matematicas" },
    { id:16, question:"¿Cuál es el mínimo común múltiplo (mcm) de 4 y 6?", options:["8","10","12","24"], correct:2, explanation:"El múltiplo más pequeño que 4 y 6 tienen en común es 12.", category:"matematicas" },
    { id:17, question:"¿Cuánto es 144 ÷ 12?", options:["10","11","12","13"], correct:2, explanation:"12 × 12 = 144", category:"matematicas" },
    { id:18, question:"Si X + 5 = 12, ¿cuál es el valor de X?", options:["5","6","7","8"], correct:2, explanation:"X = 12 - 5. X = 7.", category:"matematicas" },
    { id:19, question:"¿Cuántos minutos hay en 3 horas?", options:["120","150","180","210"], correct:2, explanation:"3 horas × 60 minutos/hora = 180 minutos", category:"matematicas" },
    { id:20, question:"¿Cuál de estos números es un número primo?", options:["4","9","11","15"], correct:2, explanation:"Un número primo solo es divisible por 1 y por sí mismo. 11 cumple esto.", category:"matematicas" },
    { id:21, question:"¿Cuál es el 10% de 300?", options:["10","20","30","40"], correct:2, explanation:"(10 / 100) * 300 = 0.1 * 300 = 30", category:"matematicas" },
    { id:22, question:"¿Cuál es el volumen de un cubo con 2 cm de arista?", options:["4 cm³","6 cm³","8 cm³","12 cm³"], correct:2, explanation:"Volumen = 2 × 2 × 2 = 8 cm³", category:"matematicas" },
    { id:23, question:"¿Cuánto es 5! (5 factorial)?", options:["15","25","100","120"], correct:3, explanation:"5! = 5 × 4 × 3 × 2 × 1 = 120", category:"matematicas" },
    { id:24, question:"¿Cuál es el promedio de 5, 10 y 15?", options:["8","10","12","15"], correct:1, explanation:"(5 + 10 + 15) / 3 = 30 / 3 = 10", category:"matematicas" },
    { id:25, question:"¿Cómo se escribe 49 en números romanos?", options:["XIL","XLIX","XXXIX","IL"], correct:1, explanation:"XL = 40 (50-10), IX = 9 (10-1). 40 + 9 = 49.", category:"matematicas" },
    { id:26, question:"¿Cuántos lados tiene un octágono?", options:["6","7","8","9"], correct:2, explanation:"Un octágono es un polígono de 8 lados.", category:"matematicas" },
    { id:27, question:"¿Cuál es el resultado de 120 ÷ 5?", options:["22","24","26","28"], correct:1, explanation:"120 dividido entre 5 es 24.", category:"matematicas" },
    { id:28, question:"¿Cuánto es 2⁵ (dos elevado a la quinta potencia)?", options:["10","16","25","32"], correct:3, explanation:"2⁵ = 2 × 2 × 2 × 2 × 2 = 32", category:"matematicas" },
    { id:29, question:"¿Cuál es el resultado de 3/4 - 1/4?", options:["1/4","1/2","2/0","1"], correct:1, explanation:"Tienen el mismo denominador, así que 3 - 1 = 2. El resultado es 2/4, que se simplifica a 1/2.", category:"matematicas" },
    { id:30, question:"¿Qué número romano es 'C'?", options:["10","50","100","500"], correct:2, explanation:"C = 100, L = 50, D = 500, M = 1000.", category:"matematicas" },
    { id:31, question:"¿Cuál es el 25% de 80?", options:["10","15","20","25"], correct:2, explanation:"25% es 1/4. Un cuarto de 80 es 20.", category:"matematicas" },
    { id:32, question:"¿Cuál es el área de un triángulo con base 10 y altura 5?", options:["15","25","50","100"], correct:1, explanation:"Área = (base × altura) / 2 = (10 × 5) / 2 = 25", category:"matematicas" },
    { id:33, question:"¿Cuántos segundos hay en una hora?", options:["60","1200","3600","6000"], correct:2, explanation:"60 minutos × 60 segundos/minuto = 3600 segundos", category:"matematicas" },
    { id:34, question:"¿Cuál es el Máximo Común Divisor (MCD) de 12 y 18?", options:["3","4","6","12"], correct:2, explanation:"Los divisores de 12 son (1,2,3,4,6,12). Los de 18 son (1,2,3,6,9,18). El más grande en común es 6.", category:"matematicas" },
    { id:35, question:"¿Qué número sigue en la serie: 2, 5, 8, 11...?", options:["12","13","14","15"], correct:2, explanation:"La serie suma 3 cada vez (11 + 3 = 14).", category:"matematicas" },
    { id:36, question:"¿Cuánto es 3 + 7 × 2?", options:["20","17","13","10"], correct:1, explanation:"Por orden de operaciones, 7 × 2 = 14. Luego 3 + 14 = 17.", category:"matematicas" },
    { id:37, question:"¿Cuál es la circunferencia de un círculo con radio 5? (Usar π≈3.14)", options:["15.70","31.40","78.50","25"], correct:0, explanation:"Circunferencia = 2 × π × r = 2 × 3.14 × 5 = 15.70", category:"matematicas" },
    { id:38, question:"¿Cómo se escribe 0.75 en fracción?", options:["1/2","3/4","1/4","7/5"], correct:1, explanation:"0.75 equivale a tres cuartos (3/4).", category:"matematicas" },
    { id:39, question:"¿Cuál es el resultado de 1/2 × 3/4?", options:["3/8","4/6","1/2","1"], correct:0, explanation:"La multiplicación de fracciones es directa: (1 × 3) / (2 × 4) = 3/8.", category:"matematicas" },
    { id:40, question:"¿Cuántos centímetros cúbicos (cm³) hay en un litro?", options:["10","100","1000","10000"], correct:2, explanation:"1 Litro equivale a 1000 cm³ (o 1 decímetro cúbico).", category:"matematicas" },
    { id:41, question:"Si un ángulo mide 30°, ¿cuál es su ángulo complementario?", options:["30°","60°","150°","330°"], correct:1, explanation:"Dos ángulos son complementarios si suman 90°. (90 - 30 = 60°).", category:"matematicas" },
    { id:42, question:"¿Cuál es la raíz cuadrada de 121?", options:["10","11","12","13"], correct:1, explanation:"11 × 11 = 121", category:"matematicas" },
    { id:43, question:"¿Cuántos vértices tiene un cubo?", options:["4","6","8","12"], correct:2, explanation:"Un cubo tiene 8 vértices (esquinas), 12 aristas (lados) y 6 caras.", category:"matematicas" },
    { id:44, question:"¿Cuánto es -5 + 12?", options:["-17","-7","7","17"], correct:2, explanation:"Si tienes 12 y le quitas 5, te quedan 7.", category:"matematicas" },
    { id:45, question:"¿Cuál es el 20% de 150?", options:["20","30","40","50"], correct:1, explanation:"(20 / 100) * 150 = 0.2 * 150 = 30", category:"matematicas" },
    { id:46, question:"¿Qué número romano es 'D'?", options:["100","500","1000","50"], correct:1, explanation:"D = 500", category:"matematicas" },
    { id:47, question:"¿Cuál es el resultado de 10² + 10¹?", options:["30","110","20","1000"], correct:1, explanation:"10² = 100. 10¹ = 10. 100 + 10 = 110.", category:"matematicas" },
    { id:48, question:"¿Cuál es el promedio de 2, 4, 6 y 8?", options:["4","5","6","20"], correct:1, explanation:"(2 + 4 + 6 + 8) / 4 = 20 / 4 = 5", category:"matematicas" },
    { id:49, question:"¿Cuántos mililitros hay en 2.5 litros?", options:["250","2500","25000","0.25"], correct:1, explanation:"1 litro = 1000 ml. 2.5 × 1000 = 2500 ml.", category:"matematicas" },
    { id:50, question:"Si X / 4 = 5, ¿cuál es el valor de X?", options:["1.25","9","16","20"], correct:3, explanation:"X = 5 × 4. X = 20.", category:"matematicas" },

        // CIENCIAS (10)
    { id:101, question:"¿Qué planeta es conocido como el 'planeta rojo'?", options:["Venus","Júpiter","Marte","Saturno"], correct:2, explanation:"Marte es llamado el planeta rojo debido al óxido de hierro en su superficie.", category:"ciencias" },
    { id:102, question:"¿Cuál es la fórmula química del agua?", options:["O2","CO2","H2O","NaCl"], correct:2, explanation:"H2O (dos átomos de hidrógeno y uno de oxígeno)", category:"ciencias" },
    { id:103, question:"¿Qué gas necesitan las plantas para realizar la fotosíntesis?", options:["Oxígeno","Nitrógeno","Dióxido de carbono","Hidrógeno"], correct:2, explanation:"Las plantas absorben dióxido de carbono y liberan oxígeno.", category:"ciencias" },
    { id:104, question:"¿Cuál es el elemento químico más abundante en el universo?", options:["Oxígeno","Carbono","Hierro","Hidrógeno"], correct:3, explanation:"El hidrógeno, el elemento más simple, es el más abundante.", category:"ciencias" },
    { id:105, question:"¿Qué órgano bombea sangre en el cuerpo humano?", options:["Pulmón","Hígado","Corazón","Cerebro"], correct:2, explanation:"El corazón es el músculo que bombea sangre a todo el cuerpo.", category:"ciencias" },
    { id:106, question:"¿Qué partícula subatómica tiene carga positiva?", options:["Electrón","Neutrón","Protón","Fotón"], correct:2, explanation:"El protón tiene carga positiva, el electrón negativa y el neutrón no tiene carga.", category:"ciencias" },
    { id:107, question:"¿Qué planeta es el más grande del sistema solar?", options:["Tierra","Júpiter","Saturno","Urano"], correct:1, explanation:"Júpiter es un gigante gaseoso y el planeta más grande.", category:"ciencias" },
    { id:108, question:"¿Cuál es el símbolo químico del oro?", options:["Ag","Au","Or","Go"], correct:1, explanation:"'Au' viene del latín 'Aurum', que significa oro.", category:"ciencias" },
    { id:109, question:"¿Qué gas es esencial para la respiración humana?", options:["Nitrógeno","Oxígeno","Dióxido de carbono","Hidrógeno"], correct:1, explanation:"Los humanos y muchos otros seres vivos necesitan oxígeno para respirar.", category:"ciencias" },

const allQuestions = generateQuestions();

let userAnswers = [];
let timer, timeLeft = 120;

/* DOM */
const categoryScreen = document.getElementById('category-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results-screen');
const categoriesContainer = document.getElementById('categories-container');
const startBtn = document.getElementById('start-btn');
const questionText = document.getElementById('question-text');
const questionCategory = document.getElementById('question-category');
const optionsContainer = document.getElementById('options-container');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const questionNumber = document.getElementById('question-number');
const currentQuestionSpan = document.getElementById('current-question');
const timeDisplay = document.getElementById('time');
const finalScore = document.getElementById('final-score');
const resultMessage = document.getElementById('result-message');
const resultsSummary = document.getElementById('results-summary');
const restartBtn = document.getElementById('restart-btn');
const feedbackDiv = document.getElementById('feedback');
const confettiCanvas = document.getElementById('confetti-canvas');
const app = document.getElementById('app');

/* -------------------------
   Inicializar app
   ------------------------- */
function initApp(){
    renderCategories();
    setupEventListeners();
}
window.onload = initApp;

/* -------------------------
   Render categorías
   ------------------------- */
function renderCategories(){
    categoriesContainer.innerHTML = '';
    categories.forEach(cat=>{
        const card = document.createElement('div');
        card.className = 'category-card';
        card.dataset.id = cat.id;
        card.innerHTML = `<div class="category-icon">${cat.icon}</div><div class="category-name">${cat.name}</div>`;
        card.addEventListener('click', ()=> selectCategory(cat.id, card));
        categoriesContainer.appendChild(card);
    });
}

function selectCategory(categoryId, cardEl){
    document.querySelectorAll('.category-card').forEach(c=>c.classList.remove('selected'));
    cardEl.classList.add('selected');
    selectedCategory = categoryId;
    startBtn.disabled = false;
}

/* -------------------------
   Event listeners
   ------------------------- */
function setupEventListeners(){
    startBtn.addEventListener('click', startQuiz);
    prevBtn.addEventListener('click', prevQuestion);
    nextBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restartQuiz);
}

/* -------------------------
   Iniciar cuestionario
   ------------------------- */
function startQuiz(){
    if(selectedCategory === 'mixtas'){
        currentQuestions = getRandomQuestions(allQuestions, 10);
    } else {
        const pool = allQuestions.filter(q=> q.category === selectedCategory);
        currentQuestions = getRandomQuestions(pool, 10);
    }
    currentQuestionIndex = 0;
    userAnswers = Array(10).fill(null);
    startTimer();
    showQuestion();
    categoryScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    resultsScreen.style.display = 'none';
}

/* -------------------------
   Random questions
   ------------------------- */
function getRandomQuestions(questions, count){
    if(questions.length <= count) return [...questions];
    return [...questions].sort(()=>0.5 - Math.random()).slice(0,count);
}

/* -------------------------
   Mostrar pregunta
   ------------------------- */
function showQuestion(){
    const q = currentQuestions[currentQuestionIndex];
    const catInfo = categories.find(c=> c.id === q.category) || {name:'', color:'#888'};

    questionText.textContent = q.question;
    questionNumber.textContent = currentQuestionIndex + 1;
    currentQuestionSpan.textContent = currentQuestionIndex + 1;

    questionCategory.textContent = catInfo.name;
    questionCategory.style.backgroundColor = catInfo.color;
    questionCategory.style.color = '#fff';

    // opciones
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx)=>{
        const el = document.createElement('div');
        el.className = 'option';
        if(userAnswers[currentQuestionIndex] === idx) el.classList.add('selected');

        const letter = document.createElement('div');
        letter.className = 'option-letter';
        letter.textContent = String.fromCharCode(65 + idx);

        const text = document.createElement('div');
        text.textContent = opt;

        el.appendChild(letter);
        el.appendChild(text);

        el.addEventListener('click', ()=> selectOption(idx));
        optionsContainer.appendChild(el);
    });

    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.textContent = currentQuestionIndex === 9 ? 'Finalizar' : 'Siguiente';
}

/* -------------------------
   Seleccionar opción (feedback inmediato)
   ------------------------- */
function selectOption(optionIndex){
    const q = currentQuestions[currentQuestionIndex];

    // Guardar respuesta
    userAnswers[currentQuestionIndex] = optionIndex;

    // Marcar seleccionado visualmente
    // (re-render opciones)
    showQuestion();

    // Mostrar feedback inmediato
    if(optionIndex === q.correct){
        showFeedbackCorrect();
    } else {
        showFeedbackIncorrect();
    }
}

/* -------------------------
   Feedback: Correcto (confeti + cohete)
   ------------------------- */
function showFeedbackCorrect(){
    // texto
    feedbackDiv.className = 'feedback correct show';
    feedbackDiv.innerHTML = `✅ ¡Correcto! <span style="margin-left:8px">🎉🚀</span>`;

    // confetti por toda la pantalla
    confettiBurst(80);

    // ocultar después
    setTimeout(()=>{ feedbackDiv.classList.remove('show'); }, 1600);
}

/* -------------------------
   Feedback: Incorrecto (X roja + carita triste + vibración)
   ------------------------- */
function showFeedbackIncorrect(){
    feedbackDiv.className = 'feedback incorrect show';
    feedbackDiv.innerHTML = `❌ Incorrecto <span style="margin-left:8px">😢</span>`;

    // efecto de temblor en contenedor de opciones
    optionsContainer.classList.add('shake');
    setTimeout(()=>{ optionsContainer.classList.remove('shake'); }, 480);

    // vibrar si el dispositivo lo permite
    if(window.navigator && navigator.vibrate){
        navigator.vibrate([80,40,80]);
    }

    setTimeout(()=>{ feedbackDiv.classList.remove('show'); }, 1400);
}

/* -------------------------
   Navegación preguntas
   ------------------------- */
function prevQuestion(){ if(currentQuestionIndex > 0){ currentQuestionIndex--; showQuestion(); } }
function nextQuestion(){ if(currentQuestionIndex < 9){ currentQuestionIndex++; showQuestion(); } else { finishQuiz(); } }

/* -------------------------
   Temporizador
   ------------------------- */
function startTimer(){
    clearInterval(timer);
    timeLeft = 120;
    updateTimerDisplay();
    timer = setInterval(()=>{
        timeLeft--;
        updateTimerDisplay();
        if(timeLeft <= 0){ clearInterval(timer); finishQuiz(); }
    },1000);
}
function updateTimerDisplay(){
    const m = Math.floor(timeLeft/60);
    const s = timeLeft%60;
    timeDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(timeLeft <= 10){ timeDisplay.style.color = '#dc3545'; } else { timeDisplay.style.color = ''; }
}

/* -------------------------
   Finalizar y mostrar resultados
   ------------------------- */
function finishQuiz(){
    clearInterval(timer);
    let score = 0;
    currentQuestions.forEach((q,i)=>{ if(userAnswers[i] === q.correct) score++; });

    finalScore.textContent = `${score}/10`;
    if(score >= 9) resultMessage.textContent = "¡Excelente! Has demostrado un gran conocimiento.";
    else if(score >= 7) resultMessage.textContent = "¡Buen trabajo! Tienes un buen nivel de conocimiento.";
    else if(score >= 5) resultMessage.textContent = "Resultado aceptable. Sigue practicando para mejorar.";
    else resultMessage.textContent = "Necesitas repasar más. ¡No te rindas!";

    // Resumen
    resultsSummary.innerHTML = '';
    currentQuestions.forEach((q,i)=>{
        const isCorrect = userAnswers[i] === q.correct;
        const userAnsText = userAnswers[i] !== null ? `${String.fromCharCode(65+userAnswers[i])}. ${q.options[userAnswers[i]]}` : 'Sin responder';
        const correctText = `${String.fromCharCode(65+q.correct)}. ${q.options[q.correct]}`;
        const catInfo = categories.find(c=> c.id === q.category) || {color:'#999', name:q.category};

        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                <div style="min-width:60%"><div class="result-question">${i+1}. ${q.question}</div>
                <div style="margin-top:6px;"><span class="category-tag" style="background:${catInfo.color};color:#fff;padding:6px 10px;border-radius:999px;font-weight:700">${catInfo.name}</span></div></div>
                <div style="text-align:right;min-width:30%">
                    <div style="font-weight:900; font-size:1.05rem; ${isCorrect ? 'color:#28a745' : 'color:#dc3545'}">
                        ${isCorrect ? '✅ Correcto 😁' : '❌ Incorrecto 😞'}
                    </div>
                </div>
            </div>
            <div style="margin-top:8px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                <div>Tu respuesta: <strong class="${isCorrect ? 'correct' : 'incorrect'}">${userAnsText}</strong></div>
                <div>Respuesta correcta: <strong class="correct">${correctText}</strong></div>
            </div>
            <div style="margin-top:8px;"><small>${q.explanation}</small></div>
        `;
        resultsSummary.appendChild(item);
    });

    // Cambiar pantallas
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'block';
}

/* -------------------------
   Reiniciar
   ------------------------- */
function restartQuiz(){
    selectedCategory = null;
    document.querySelectorAll('.category-card').forEach(c=>c.classList.remove('selected'));
    startBtn.disabled = true;
    categoryScreen.style.display = 'block';
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'none';
}

/* -------------------------
   Confetti system (canvas particles)
   ------------------------- */
(function setupConfetti(){
    const ctx = confettiCanvas.getContext('2d');
    let W = confettiCanvas.width = app.clientWidth;
    let H = confettiCanvas.height = app.clientHeight;
    const particles = [];
    let animating = false;

    // Resize canvas with container
    function resize(){
        W = confettiCanvas.width = app.clientWidth;
        H = confettiCanvas.height = app.clientHeight;
    }
    window.addEventListener('resize', resize);

    // Colors for confetti
    const COLORS = ['#ff5c9e','#ffd166','#4ecdc4','#7209b7','#ff9e64','#4a00e0','#2575fc','#ffd6e0'];

    function random(min, max){ return Math.random()*(max-min)+min; }

    // Create burst
    window.confettiBurst = function(count=60){
        for(let i=0;i<count;i++){
            particles.push({
                x: random(0, W),
                y: random(-20, H/3),
                w: random(6,12),
                h: random(8,14),
                vx: random(-3.5,3.5),
                vy: random(1,5),
                angle: random(0, Math.PI*2),
                angularVel: random(-0.15,0.15),
                color: COLORS[Math.floor(Math.random()*COLORS.length)],
                ttl: random(80,160),
                gravity: random(0.02,0.12),
                drag: 0.995
            });
        }
        if(!animating){ animating = true; requestAnimationFrame(update); }
    };

    // Animation loop
    function update(){
        ctx.clearRect(0,0,W,H);
        for(let i=particles.length-1;i>=0;i--){
            const p = particles[i];
            p.vy += p.gravity;
            p.vx *= p.drag;
            p.vy *= p.drag;
            p.x += p.vx;
            p.y += p.vy;
            p.angle += p.angularVel;
            p.ttl--;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();

            if(p.y > H + 40 || p.ttl <= 0) particles.splice(i,1);
        }

        if(particles.length>0){ requestAnimationFrame(update); } else { animating = false; ctx.clearRect(0,0,W,H); }
    }
})();
